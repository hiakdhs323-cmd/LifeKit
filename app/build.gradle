plugins { id 'com.android.application' }

android { namespace 'com.lifekit.app'; compileSdk 36
    defaultConfig { applicationId 'com.lifekit.app'; minSdk 23; targetSdk 36; versionCode 2; versionName '1.1.0' }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}
