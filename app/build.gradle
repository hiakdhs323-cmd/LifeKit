plugins { id 'com.android.application' }

android {
    namespace 'com.lifekit.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lifekit.app'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '2.0.0'
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
}
